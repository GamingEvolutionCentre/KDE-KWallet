name: Release KDE-KWallet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.1.0)
        required: true
        default: 1.1.0
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="1.1.0"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic versioning, for example 1.1.0" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "base=KDE-KWallet-v$version" >> "$GITHUB_OUTPUT"

      - name: Validate distribution packages
        shell: bash
        run: |
          set -euo pipefail

          distros=(Arch Debian Ubuntu-Kubuntu Fedora openSUSE)

          for distro in "${distros[@]}"; do
            test -f "$distro/installer.sh"
            test -f "$distro/Open-KWallet.sh"
            test -f "$distro/open-kwallet.desktop"
            test -f "$distro/uninstaller.sh"

            bash -n "$distro/installer.sh"
            bash -n "$distro/Open-KWallet.sh"
            bash -n "$distro/uninstaller.sh"
          done

      - name: Build per-distribution archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          distros=(Arch Debian Ubuntu-Kubuntu Fedora openSUSE)

          for distro in "${distros[@]}"; do
            package="$BASE-$distro"
            mkdir -p "dist/$package"

            cp \
              "$distro/installer.sh" \
              "$distro/Open-KWallet.sh" \
              "$distro/open-kwallet.desktop" \
              "$distro/uninstaller.sh" \
              "dist/$package/"

            chmod 755 \
              "dist/$package/installer.sh" \
              "dist/$package/Open-KWallet.sh" \
              "dist/$package/uninstaller.sh"

            chmod 644 "dist/$package/open-kwallet.desktop"

            tar -C dist -czf "dist/$package.tar.gz" "$package"
            (cd dist && zip -qr "$package.zip" "$package")
          done

          (
            cd dist
            sha256sum \
              "$BASE"-*.tar.gz \
              "$BASE"-*.zip \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF_NOTES
          # KDE-KWallet v$VERSION

          KDE-KWallet v1.1 introduces separate downloads for each supported Linux distribution.

          ## Choose your distribution

          - Arch Linux: \`$BASE-Arch.zip\` or \`$BASE-Arch.tar.gz\`
          - Debian: \`$BASE-Debian.zip\` or \`$BASE-Debian.tar.gz\`
          - Ubuntu / Kubuntu: \`$BASE-Ubuntu-Kubuntu.zip\` or \`$BASE-Ubuntu-Kubuntu.tar.gz\`
          - Fedora: \`$BASE-Fedora.zip\` or \`$BASE-Fedora.tar.gz\`
          - openSUSE: \`$BASE-openSUSE.zip\` or \`$BASE-openSUSE.tar.gz\`

          Each distribution archive contains only:

          - \`installer.sh\`
          - \`Open-KWallet.sh\`
          - \`open-kwallet.desktop\`
          - \`uninstaller.sh\`

          Extract the archive for your distribution and run:

          \`chmod +x installer.sh\`

          \`./installer.sh\`

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF_NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --clobber

            gh release edit "$TAG" \
              --title "KDE-KWallet v$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "KDE-KWallet v$VERSION" \
              --notes-file release-notes.md
          fi
